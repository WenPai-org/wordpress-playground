name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  product-tooling:
    runs-on: ubuntu-22.04
    container:
      image: node:22.23.0-bookworm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify locked build runtime
        run: |
          test "$(node -p 'process.versions.node')" = "22.23.0"
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 11)'
      - name: Unit, localization contract, transform and security gates
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tools/localization_overlay.py catalog-check
          python3 tools/transform-hash.py -o evidence/transform-digest.json
          python3 -c 'import json; a=json.load(open("upstream-lock.json"))["downstream"]["transform_sha256"]; b=json.load(open("evidence/transform-digest.json"))["transform_sha256"]; assert a==b,(a,b)'
          python3 tools/security-scan.py .
      - name: Workflow syntax smoke
        run: python3 -c "import pathlib; assert len(list(pathlib.Path('.forgejo/workflows').glob('*.yml'))) == 4"
  exact-upstream-website:
    runs-on: ubuntu-22.04
    container:
      image: node:22.23.0-bookworm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify locked build runtime
        run: |
          test "$(node -p 'process.versions.node')" = "22.23.0"
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 11)'
      - name: Materialize exact upstream and generated assets
        run: |
          rm -rf .ci-work
          mkdir -p .ci-work
          test "$(node -p 'process.versions.node')" = "22.23.0"
          test "$(corepack npm@10.9.2 --version)" = "10.9.2"
          tag=$(python3 -c 'import json; print(json.load(open("upstream-lock.json"))["upstream"]["tag"])')
          commit=$(python3 -c 'import json; print(json.load(open("upstream-lock.json"))["upstream"]["commit"])')
          git clone --depth=1 --branch "$tag" https://feicode.com/WPFork/wordpress-playground-upstream.git .ci-work/upstream
          test "$(git -C .ci-work/upstream rev-parse HEAD)" = "$commit"
          mkdir .ci-work/source-archive
          git -C .ci-work/upstream archive "$commit" | tar -x -C .ci-work/source-archive
          python3 tools/source-manifest.py .ci-work/source-archive --allow-internal-symlinks -o .ci-work/source-manifest.json
          python3 -c 'import json; a=json.load(open("upstream-lock.json"))["upstream"]["source_sha256"]; b=json.load(open(".ci-work/source-manifest.json"))["manifest_sha256"]; assert a==b,(a,b)'
          python3 tools/apply-overlay.py --upstream .ci-work/source-archive --output .ci-work/product-source-1 --report .ci-work/overlay-report-1.json
          python3 tools/apply-overlay.py --upstream .ci-work/source-archive --output .ci-work/product-source-2 --report .ci-work/overlay-report-2.json
          cmp .ci-work/overlay-report-1.json .ci-work/overlay-report-2.json
          python3 tools/restore-upstream-generated-assets.py --repository .ci-work/upstream --destination .ci-work/product-source-1 --report .ci-work/upstream-export-ignored-assets-1.json
          python3 tools/restore-upstream-generated-assets.py --repository .ci-work/upstream --destination .ci-work/product-source-2 --report .ci-work/upstream-export-ignored-assets-2.json
          cmp .ci-work/upstream-export-ignored-assets-1.json .ci-work/upstream-export-ignored-assets-2.json
          python3 tools/sync-generated-assets.py --source .ci-work/product-source-1 --report .ci-work/generated-assets-1.json
          python3 tools/sync-generated-assets.py --source .ci-work/product-source-2 --report .ci-work/generated-assets-2.json
          mkdir -p .ci-work/notices-source
          python3 tools/license-notice-audit.py --source .ci-work/upstream --expected-commit "$commit" --inventory docs/licenses/third-party-inventory.json --output .ci-work/notices-source/license-notice-audit-source.json --node-notices .ci-work/notices-source/node-license-notices.json
      - name: Two independent exact website builds and artifact comparison
        run: |
          python3 tools/transform-hash.py -o .ci-work/transform.json
          transform=$(python3 -c 'import json; print(json.load(open(".ci-work/transform.json"))["transform_sha256"])')
          test "$transform" = "$(python3 -c 'import json; print(json.load(open("upstream-lock.json"))["downstream"]["transform_sha256"])')"
          epoch=$(python3 -c 'import json; print(json.load(open("upstream-lock.json"))["toolchain"]["source_date_epoch"])')
          version=$(python3 -c 'import json; print(json.load(open("upstream-lock.json"))["downstream"]["version"])')
          commit=$(python3 -c 'import json; print(json.load(open("upstream-lock.json"))["upstream"]["commit"])')
          source_sha=$(python3 -c 'import json; print(json.load(open("upstream-lock.json"))["upstream"]["source_sha256"])')
          for number in 1 2; do
            source=".ci-work/product-source-$number"
            (cd "$source" && corepack npm@10.9.2 ci --ignore-scripts)
            test_patch="$GITHUB_WORKSPACE/overlays/patches/0001-localization-test-contract.patch"
            footer_spec="$source/packages/playground/website/src/components/site-manager/site-settings-form/site-settings-action-footer.spec.tsx"
            dock_spec="$source/packages/playground/website/src/components/dock/dock-toggle-pill.spec.tsx"
            if grep -Fq "getButton('应用到此 Playground')" "$footer_spec" && grep -Fq 'aria-label="显示工具"' "$dock_spec"; then
              : # localized contract preserved by dependency installation
            else
              GIT_CEILING_DIRECTORIES="$(dirname "$source")" git -C "$source" apply --no-index --check --whitespace=error-all "$test_patch"
              GIT_CEILING_DIRECTORIES="$(dirname "$source")" git -C "$source" apply --no-index --whitespace=error-all "$test_patch"
            fi
            grep -Fq "getButton('应用到此 Playground')" "$footer_spec"
            grep -Fq 'aria-label="显示工具"' "$dock_spec"
            (cd "$source" && corepack npm@10.9.2 exec nx lint playground-website --parallel=1)
            (cd "$source" && corepack npm@10.9.2 exec nx typecheck playground-website --parallel=1)
            (cd "$source" && corepack npm@10.9.2 exec nx test playground-website --skip-nx-cache -- --runInBand)
            python3 tools/normalize-blueprint-validator.py --source "$source" --output ".ci-work/blueprint-validator-normalization-$number.json"
            rm -rf "$source/dist"
            (cd "$source" && SOURCE_DATE_EPOCH="$epoch" TZ=UTC LC_ALL=C NX_DAEMON=false NX_PARALLEL=1 NODE_OPTIONS="--require=$GITHUB_WORKSPACE/tools/deterministic-node-build.cjs" corepack npm@10.9.2 exec nx build playground-website --skip-nx-cache --parallel=1)
            runtime="$source/dist/packages/playground/wasm-wordpress-net"
            python3 tools/normalize-runtime.py --runtime "$runtime" --output ".ci-work/runtime-normalization-$number.json"
            mkdir -p ".ci-work/notices-$number"
            python3 tools/license-notice-audit.py --source .ci-work/upstream --runtime "$runtime" --expected-commit "$commit" --inventory docs/licenses/third-party-inventory.json --output ".ci-work/notices-$number/license-notice-audit-runtime.json" --node-notices .ci-work/notices-source/node-license-notices.json
            python3 tools/build-runtime.py --source "$source" --runtime-dir dist/packages/playground/wasm-wordpress-net --out-dir ".ci-work/build-$number" --version "$version" --source-sha "$source_sha" --transform-sha "$transform" --product-commit "$GITHUB_SHA" --source-date-epoch "$epoch" --package-lock package-lock.json --enforce-generated-assets --notice-audit .ci-work/notices-source/license-notice-audit-source.json --notice-audit ".ci-work/notices-$number/license-notice-audit-runtime.json" --node-notices .ci-work/notices-source/node-license-notices.json
            if [ "$number" = 1 ]; then rm -rf "$source/node_modules" "$source/dist"; fi
          done
          python3 tools/compare-runtime-builds.py --manifest-a .ci-work/build-1/runtime-manifest.json --manifest-b .ci-work/build-2/runtime-manifest.json --artifact-a .ci-work/build-1/*.tar.gz --artifact-b .ci-work/build-2/*.tar.gz --output .ci-work/build-determinism.json
          cmp .ci-work/build-1/artifact-set.json .ci-work/build-2/artifact-set.json
          cmp .ci-work/runtime-normalization-1.json .ci-work/runtime-normalization-2.json

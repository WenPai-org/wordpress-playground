name: release
on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*.*']
permissions:
  contents: write
concurrency:
  group: wenpai-playground-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-build-release:
    runs-on: ubuntu-22.04
    container:
      image: node:22.23.0-bookworm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install locked Python runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3
          rm -rf /var/lib/apt/lists/*
          test "$(node -p 'process.versions.node')" = "22.23.0"
      - name: Exact product tag and tooling gates
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *) echo "BLOCKED release must run from an immutable tag, got ${GITHUB_REF}" >&2; exit 1 ;;
          esac
          tag="${GITHUB_REF#refs/tags/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "BLOCKED invalid downstream release tag: $tag" >&2
            exit 1
          }
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "${GITHUB_SHA}"
          test "$(node -p 'process.versions.node')" = "22.23.0"
          test "$(corepack npm@10.9.2 --version)" = "10.9.2"
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tools/security-scan.py .
      - name: Materialize, verify and localize exact upstream
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("upstream-lock.json"))["upstream"]["tag"])')
          commit=$(python3 -c 'import json; print(json.load(open("upstream-lock.json"))["upstream"]["commit"])')
          git clone --depth=1 --branch "$tag" https://feicode.com/WPFork/wordpress-playground-upstream.git /tmp/upstream
          test "$(git -C /tmp/upstream rev-parse HEAD)" = "$commit"
          mkdir /tmp/source-archive
          git -C /tmp/upstream archive "$commit" | tar -x -C /tmp/source-archive
          python3 tools/source-manifest.py /tmp/source-archive --allow-internal-symlinks -o /tmp/source-manifest.json
          python3 -c 'import json; a=json.load(open("upstream-lock.json"))["upstream"]["source_sha256"]; b=json.load(open("/tmp/source-manifest.json"))["manifest_sha256"]; assert a==b,(a,b)'
          python3 tools/license-notice-audit.py --source /tmp/upstream --expected-commit "$commit" --inventory docs/licenses/third-party-inventory.json --output evidence/license-notice-audit-source.json --node-notices evidence/node-license-notices.json
          python3 tools/apply-overlay.py --upstream /tmp/source-archive --output /tmp/product-source-1 --report evidence/overlay-report-1.json
          python3 tools/apply-overlay.py --upstream /tmp/source-archive --output /tmp/product-source-2 --report evidence/overlay-report-2.json
          cmp evidence/overlay-report-1.json evidence/overlay-report-2.json
          python3 tools/sync-generated-assets.py --source /tmp/product-source-1 --report evidence/php-next-assets-1.json
          python3 tools/sync-generated-assets.py --source /tmp/product-source-2 --report evidence/php-next-assets-2.json
      - name: Upstream relevant gates and website build
        run: |
          for source in /tmp/product-source-1 /tmp/product-source-2; do
            cd "$source"
            corepack npm@10.9.2 ci --ignore-scripts
            corepack npm@10.9.2 exec nx lint playground-website --parallel=1
            corepack npm@10.9.2 exec nx typecheck playground-website --parallel=1
            corepack npm@10.9.2 exec nx test playground-website --parallel=1
          done
      - name: Reproducible clean website build one and two
        run: |
          python3 tools/transform-hash.py -o /tmp/transform.json
          transform=$(python3 -c 'import json; print(json.load(open("/tmp/transform.json"))["transform_sha256"])')
          test "$transform" = "$(python3 -c 'import json; print(json.load(open("upstream-lock.json"))["downstream"]["transform_sha256"])')"
          epoch=$(python3 -c 'import json; print(json.load(open("upstream-lock.json"))["toolchain"]["source_date_epoch"])')
          version=$(python3 -c 'import json; print(json.load(open("upstream-lock.json"))["downstream"]["version"])')
          for number in 1 2; do
            source="/tmp/product-source-$number"
            build="/tmp/build-$number"
            python3 tools/normalize-blueprint-validator.py --source "$source" --output "/tmp/blueprint-validator-normalization-$number.json"
            rm -rf "$source/dist"
            (cd "$source" && SOURCE_DATE_EPOCH="$epoch" TZ=UTC LC_ALL=C NX_DAEMON=false NX_PARALLEL=1 NODE_OPTIONS="--require=$GITHUB_WORKSPACE/tools/deterministic-node-build.cjs" corepack npm@10.9.2 exec nx build playground-website --skip-nx-cache --parallel=1)
            python3 tools/normalize-runtime.py --runtime "$source/dist/packages/playground/wasm-wordpress-net" --output "/tmp/runtime-normalization-$number.json"
            mkdir -p "/tmp/notices-$number"
            python3 tools/license-notice-audit.py --source /tmp/upstream --runtime "$source/dist/packages/playground/wasm-wordpress-net" --expected-commit "$(python3 -c 'import json; print(json.load(open("upstream-lock.json"))["upstream"]["commit"])')" --inventory docs/licenses/third-party-inventory.json --output "/tmp/notices-$number/license-notice-audit-runtime.json" --node-notices evidence/node-license-notices.json
            python3 tools/build-runtime.py --source "$source" --runtime-dir dist/packages/playground/wasm-wordpress-net --out-dir "$build" --version "$version" --source-sha "$(python3 -c 'import json; print(json.load(open("upstream-lock.json"))["upstream"]["source_sha256"])')" --transform-sha "$transform" --product-commit "$GITHUB_SHA" --source-date-epoch "$epoch" --package-lock package-lock.json --enforce-generated-assets --notice-audit evidence/license-notice-audit-source.json --notice-audit "/tmp/notices-$number/license-notice-audit-runtime.json" --node-notices evidence/node-license-notices.json
            if [ "$number" = 1 ]; then rm -rf "$source/node_modules" "$source/dist"; fi
          done
          python3 tools/compare-runtime-builds.py \
            --manifest-a /tmp/build-1/runtime-manifest.json \
            --manifest-b /tmp/build-2/runtime-manifest.json \
            --artifact-a /tmp/build-1/*.tar.gz \
            --artifact-b /tmp/build-2/*.tar.gz \
            --output evidence/build-determinism.json
          cmp /tmp/build-1/artifact-set.json /tmp/build-2/artifact-set.json
          cmp /tmp/runtime-normalization-1.json /tmp/runtime-normalization-2.json
          test "$(python3 -c 'import json; print(json.load(open("/tmp/build-1/runtime-manifest.json"))["entrypoint_mapping"]["index.html"])')" = playground.html
          python3 - <<'PY'
          import json
          artifact=json.load(open('/tmp/build-1/artifact-set.json'))
          limit=artifact['max_attachment_bytes']
          assert artifact['artifact_size'] > 0
          assert artifact['part_count'] == len(artifact['parts']) > 0
          assert all(0 < part['size'] <= limit for part in artifact['parts'])
          if artifact['artifact_size'] <= limit:
              assert artifact['part_count'] == 1
          else:
              assert artifact['part_count'] > 1
              assert sum(part['size'] for part in artifact['parts']) == artifact['artifact_size']
          PY
      - name: Idempotent Release and anonymous SHA readback
        env:
          FEICODE_TOKEN: ${{ secrets.FEICODE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          artifacts=(/tmp/build-1/*.sha256 /tmp/build-1/runtime.json /tmp/build-1/runtime-manifest.json /tmp/build-1/sbom-summary.json /tmp/build-1/artifact-set.json /tmp/build-1/THIRD_PARTY_NOTICES.md /tmp/build-1/third-party-inventory.json /tmp/build-1/sbom-notice-metadata.json /tmp/build-1/LICENSE_TEXTS.sha256 /tmp/build-1/license-notice-audit-source.json /tmp/build-1/license-notice-audit-runtime.json /tmp/build-1/node-license-notices.json /tmp/runtime-normalization-1.json /tmp/blueprint-validator-normalization-1.json evidence/build-determinism.json ROLLBACK.md)
          if compgen -G '/tmp/build-1/*.part-*' >/dev/null; then
            artifacts+=(/tmp/build-1/*.part-*)
          else
            artifacts+=(/tmp/build-1/*.tar.gz)
          fi
          args=()
          for artifact in "${artifacts[@]}"; do args+=(--artifact "$artifact"); done
          python3 tools/release.py --tag "$tag" --commit "$GITHUB_SHA" "${args[@]}"
